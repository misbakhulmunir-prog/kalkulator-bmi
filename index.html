<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator BMI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="kalkulator-card">
        <!-- Baris Atas: Tombol Toggle di Kanan -->
        <img src="logo.png" alt="Logo Kesehatan" class="logo-bmi">
        <div class="top-bar">
            <span class="mode-label">🌙 Mode Gelap</span>
            <label class="switch">
                <input type="checkbox" id="toggle-tema" onchange="tukarTema()">
                <span class="slider"></span>
            </label>
        </div>        
        <h2>Kalkulator BMI</h2>
        <p>Masukkan data tubuh Anda di bawah ini:</p>

        <div class="input-group">
            <label for="berat">Berat Badan (kg)</label>
            <input type="number" id="berat" placeholder="Contoh: 65">
        </div>

        <div class="input-group">
            <label for="tinggi">Tinggi Badan (cm)</label>
            <input type="number" id="tinggi" placeholder="Contoh: 170">
        </div>

        <button type="button" onclick="hitungBMI()">Hitung BMI</button>

        <div id="hasil" class="hasil-box"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
